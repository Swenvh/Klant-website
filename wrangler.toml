# Cloudflare Pages: statische site uit dist/ plus de Functions in functions/ (offerteformulier en metingen).
name = "van-ommen-schilderwerken"
compatibility_date = "2025-06-17"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "van-ommen-schilderwerken"
database_id = "8c4bf0fe-a99b-4751-8c1c-ba5e9d542a49"
migrations_dir = "drizzle"

[vars]
MAIL_TO = "info@vanommenschilderwerken.nl"
MAIL_FROM = "Van Ommen Schilderwerken <website@vanommenschilderwerken.nl>"

# Geheimen (niet in dit bestand): RESEND_API_KEY en TURNSTILE_SECRET.
# Zet ze met: npx wrangler pages secret put RESEND_API_KEY
# Lokaal: kopieer .dev.vars.example naar .dev.vars.
